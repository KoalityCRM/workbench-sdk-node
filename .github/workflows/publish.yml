name: Publish SDK
run-name: SDK ${{ inputs.version }} (${{ inputs.publish && 'publish' || 'build only' }})

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version already committed in package.json
        required: true
        default: '2.0.1'
        type: string
      publish:
        description: Publish to npm after verification (requires trusted publisher setup)
        default: false
        type: boolean

permissions:
  contents: read
concurrency:
  group: sdk-publish
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Check requested version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node -e "if (require('./package.json').version !== process.env.RELEASE_VERSION) throw new Error('Version must match package.json')"
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: mkdir release && npm pack --pack-destination release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-package
          path: release/*.tgz
          if-no-files-found: error
          retention-days: 90

  publish:
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: npm
      url: https://www.npmjs.com/package/@workbenchcrm/sdk
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-package
          path: release
      - name: Publish verified tarball with trusted publishing
        run: npm publish release/*.tgz --access public --ignore-scripts
